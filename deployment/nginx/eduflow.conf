# EduFlow AI - Nginx Production Reverse Proxy Configuration
# Location: /etc/nginx/sites-available/eduflow.conf

# Upstream ASP.NET Core Application Server
upstream eduflow_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP Server - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.eduflow.example.com; # Replace with your production domain

    # ACME-challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Production Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.eduflow.example.com; # Replace with your production domain

    # SSL Certificate Configuration (Certbot paths)
    ssl_certificate /etc/letsencrypt/live/api.eduflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eduflow.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum client body size (for document/avatar uploads)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Proxy Timeouts
    proxy_connect_timeout 60s;
    # AI quiz generation can run up to AiService.TimeoutSeconds (120s)
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Root proxy location for ASP.NET Core API
    location / {
        proxy_pass http://eduflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Disable buffering for low memory usage and real-time streaming
        proxy_buffering off;
    }

    # Health Check endpoint
    location /health {
        proxy_pass http://eduflow_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
