name: EduFlow AI CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  backend-ci:
    name: Backend CI (.NET 10 & PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # CI-only throwaway values for config binding during build/test.
      # These are NOT real secrets and must never be used in production.
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=eduflow_test;Username=postgres;Password=postgres"
      JwtSettings__Secret: "8f2e91ab4c3d7e6f1a0b5c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f"
      AiService__ApiKey: "ci-internal-test-token"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/EduFlow.slnx

      - name: Build Backend
        run: dotnet build backend/EduFlow.slnx --no-restore --configuration Release

      - name: Run Backend Tests
        run: dotnet test backend/EduFlow.slnx --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend CI (React 18 & Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Lint & Build
        working-directory: ./frontend
        run: npm run build

  flutter-ci:
    name: Mobile CI (Flutter 3.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: flutter test

  ai-agent-ci:
    name: Agentic AI CI (LangGraph & Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        working-directory: ./ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent Golden Evaluation Tests
        working-directory: ./ai-agent
        run: pytest tests/ -v

      - name: Run Phase 4 Reliability Tests
        working-directory: ./ai-agent
        run: pytest tests/test_phase4_reliability.py -v
